name: gsrhino
version: 0.1.0-beta.3
authors:
  - CuriousArc
  - qrost
description: >-
  GSRhino by CuriousArc and qrost. Import local Gaussian PLY, SPLAT, SPZ
  and official Gaussian USD/USDZ scenes into an experimental native Rhino
  viewport. Full splat data, anisotropic display and SH0-3. Rhino 8.32+.
  USD import/export requires the optional private OpenUSD runtime. Local preview;
  native acceptance of this independent package is pending.
url: https://github.com/QROST
keywords:
